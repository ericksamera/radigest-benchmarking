references:
  small_yeast_s288c_plain: data/reference/small_yeast_s288c.fa
  small_yeast_s288c_gzip: data/reference/small_yeast_s288c.fa.gz
  moderate_cannabis_pink-pepper_plain: data/reference/moderate_cannabis_pink-pepper.fa
  moderate_cannabis_pink-pepper_gzip: data/reference/moderate_cannabis_pink-pepper.fa.gz

matched_digest:
  dataset: small_yeast_s288c_plain
  reference: data/reference/small_yeast_s288c.fa
  condition: B1
  enzymes: [EcoRI, MseI]
  min_size: 100
  max_size: 300
  runs: 5
  threads: 1

screening_speed:
  dataset: small_yeast_s288c_plain
  reference: data/reference/small_yeast_s288c.fa
  candidate_enzymes: config/candidate_enzymes.txt
  min_size: 300
  max_size: 600
  score_min: 1
  score_max: 2000
  size_model: hard
  runs: 5
  jobs: 2
  radigest_threads: 1

thread_scaling:
  dataset: moderate_cannabis_pink-pepper_plain
  reference: data/reference/moderate_cannabis_pink-pepper.fa
  conditions: [B1, B2]
  modes: [json, fragments_tsv]
  threads: [1, 2, 4, 8]
  runs: 7

pair_screen_scaling:
  dataset: moderate_cannabis_pink-pepper_plain
  reference: data/reference/moderate_cannabis_pink-pepper.fa
  candidate_enzymes: config/candidate_enzymes.txt
  jobs: [1, 2, 4, 8]
  runs: 3
  radigest_threads: 1

comparators:
  interval_cases: config/comparator_cases.tsv
  noncoordinate_cases: config/noncoordinate_comparator_cases.tsv
  digital_rads:
    case: digital_rads_smoke_single__D1
    dataset: digital_rads_smoke_single
    reference: data/synthetic/digital_rads_ecori_msei_double.fa
    condition: D1
    required_path: external/Digital_RADs/Digital_RADs.py
    claim_allowed: coordinate_equivalence
  ddradseqtools:
    case: small_yeast_s288c_B1
    dataset: small_yeast_s288c_plain
    reference: data/reference/small_yeast_s288c.fa
    condition: B1
    required_path: external/ddRADseqTools/Package/rsitesearch.py
    claim_allowed: coordinate_equivalence
  simrad:
    case: simrad_count_comparison
    dataset: simrad_smoke_single
    reference: data/synthetic/simrad_ecori_msei_double.fa
    condition: D1
    required_path: NA
    claim_allowed: count_level_digest
  ddgrader:
    case: ddgrader_binned_screening
    dataset: small_yeast_s288c_plain
    reference: data/reference/small_yeast_s288c.fa
    condition: B1
    required_path: external/ddRadSeqWebTool/backend/service/DigestSequence.py
    claim_allowed: screening_throughput
